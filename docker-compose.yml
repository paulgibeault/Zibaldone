services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./backend/logs:/app/logs
    env_file:
      - ./backend/.env
    depends_on:
      - litellm
    networks:
      - zibaldone-net

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - zibaldone-net

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: [ "--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - zibaldone-net

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=zibaldoneadmin
      - MINIO_ROOT_PASSWORD=zibaldonepassword
    command: server /data --console-address ":9001"
    networks:
      - zibaldone-net

  create-buckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...' &&
      until /usr/bin/mc alias set local http://minio:9000 zibaldoneadmin zibaldonepassword > /dev/null 2>&1; do
        sleep 1;
      done;
      echo 'MinIO is ready.';
      /usr/bin/mc mb --ignore-existing local/zibaldone-blobs;
      exit 0;
      "
    networks:
      - zibaldone-net

volumes:
  data:
  minio_data:

networks:
  zibaldone-net:
    driver: bridge
